<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172c39"><title>消失的第六頁｜畢旅調查</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#243340;background:#f5f3ed}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{background:#172c39;color:white;padding:18px 18px 16px;position:sticky;top:0;z-index:5;box-shadow:0 3px 16px #14232b24}header .top{display:flex;justify-content:space-between;align-items:center;max-width:650px;margin:auto}header h1{font-size:20px;letter-spacing:2px;margin:0}header small{color:#c1d6dc;font-size:11px}header button{border:1px solid #75939c;background:transparent;color:white;padding:8px 11px;border-radius:12px}.wrap{max-width:650px;margin:auto;padding:20px 16px 92px}.hero{background:linear-gradient(150deg,#213b4b,#284f57);color:#fff;border-radius:22px;padding:26px 22px;margin-bottom:18px;box-shadow:0 7px 22px #10232922}.hero h2{font-size:27px;margin:9px 0}.hero p{line-height:1.9;color:#e4edef}.muted{color:#667581}.eyebrow{font-size:12px;letter-spacing:1.5px;color:#987443;font-weight:750}.card{background:white;border:1px solid #e5e4dd;border-radius:19px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px #182c3510}.card h2{font-size:21px;margin:6px 0 12px}.card h3{font-size:17px;margin:14px 0 9px}p{line-height:1.85}label{display:block;line-height:1.65;margin:10px 0 5px;font-weight:650}input,textarea{width:100%;border:1px solid #c9d0ce;background:white;border-radius:12px;padding:13px;color:#1d333c;margin:4px 0 12px}textarea{min-height:88px}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#245d62;color:white;font-weight:750;margin:8px 0;min-height:48px}.btn:disabled{opacity:.45}.btn.alt{background:#edf1ef;color:#2c5557}.btn.outline{background:white;border:1px solid #a9bdba;color:#285a5f}.flex{display:flex;gap:9px;flex-wrap:wrap}.flex .btn{flex:1;min-width:120px}.pill{display:inline-flex;padding:6px 10px;background:#e7f0e8;color:#315f51;border-radius:30px;font-size:12px;font-weight:700}.task{padding:14px;background:#f2f5f2;border-radius:14px;margin:10px 0}.task.done{background:#e8f3eb;border:1px solid #a5cbb3}.option{display:block;border:1px solid #d3dcda;border-radius:12px;padding:13px;margin:9px 0;background:#fff;line-height:1.65;font-weight:400}.option input{width:auto;margin:0 8px 0 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.progress{height:8px;background:#dce5e1;border-radius:20px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:#82b8a5;transition:width .2s}.notice{border-left:4px solid #b7a072;background:#fcf8ec;padding:13px 14px;border-radius:8px;line-height:1.8}.ok{background:#e4f4e8;color:#215840;padding:13px;border-radius:12px;margin:12px 0}.error{color:#b4483c;font-size:14px}.tag{font-size:12px;color:#536e73}.bag{position:fixed;inset:0;background:#14232b88;display:none;z-index:10;padding:15px;overflow:auto}.bag.open{display:block}.sheet{background:#fbfaf6;max-width:650px;margin:25px auto;border-radius:19px;padding:20px;min-height:50vh}.sheet h2{margin:0}.sheet .close{border:0;background:#e7ece9;border-radius:12px;padding:9px 14px}.sheet section{border-bottom:1px solid #dce3de;padding:10px 0}.small{font-size:13px;line-height:1.65;color:#647176}.records{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.record{background:#edf1ee;padding:14px;border-radius:12px;line-height:1.6;font-size:14px}.record b{display:block;font-size:21px;color:#2d605d}.pic{width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:#e8e7de}.placeholder{border:2px dashed #cbd3ca;padding:30px 15px;text-align:center;background:#f3f4ee;border-radius:12px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;background:#fff;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -3px 15px #20313c15;z-index:4}.nav button{flex:1;max-width:210px;background:#eaf0ed;border:0;border-radius:10px;padding:9px;font-size:13px;color:#294b53;font-weight:650}.nav button.active{background:#245d62;color:#fff}details{background:#f2f4f0;padding:12px;border-radius:12px;margin-top:12px}summary{cursor:pointer;font-weight:650}.success-illustration{text-align:center;font-size:52px;margin:20px 0}footer{color:#7f8882;text-align:center;padding:12px 4px;font-size:11px} .fade{animation:fade .2s ease}@keyframes fade{from{opacity:.5;transform:translateY(4px)}}
</style></head>
<body><header><div class="top"><div><small>畢旅實境解謎・老師手機版</small><h1>消失的第六頁</h1></div><button onclick="openBag()">🎒 調查背包</button></div></header><main id="app" class="wrap"></main><div class="nav"><button id="navHome" onclick="show('home')">📖 日誌</button><button id="nav921" onclick="show('quake')">🌍 921</button><button id="navMuseum" onclick="show('museum')">🔬 科博館</button></div><div class="bag" id="bag" onclick="if(event.target===this)closeBag()"><div class="sheet"><div class="row"><h2>🎒 調查背包</h2><button class="close" onclick="closeBag()">關閉 ×</button></div><div id="bagBody"></div></div></div>
<script>
const KEY="missing-page-v1";const defaults={team:"",quake:{a:false,b:false,code:false},museum:{a:false,b:false,c:false},current:"home",answers:{},reveal:false};
let s;try{s=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){s=JSON.parse(JSON.stringify(defaults))}s={...JSON.parse(JSON.stringify(defaults)),...s};s.quake={...defaults.quake,...s.quake};s.museum={...defaults.museum,...s.museum};s.answers=s.answers||{};s.visited=s.visited||{quake:false,museum:false};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function get(k){return s.answers[k]||""}function set(k,v){s.answers[k]=v;persist()}function field(k,placeholder="",multi=false){return multi?'<textarea id="'+k+'" placeholder="'+esc(placeholder)+'">'+esc(get(k))+'</textarea>':'<input id="'+k+'" autocomplete="off" placeholder="'+esc(placeholder)+'" value="'+esc(get(k))+'">'}function read(k){const el=document.getElementById(k);if(el)set(k,el.value);return get(k).replace(/\s/g,"").trim()}function clean(v){return String(v).trim().replace(/[\s，,。．、]/g,"").replace(/臺/g,"台")}function openBag(){bagBody();document.getElementById("bag").classList.add("open")}function closeBag(){document.getElementById("bag").classList.remove("open")}function show(k){s.current=k;if(k==="quake"||k==="museum")s.visited[k]=true;persist();render();scrollTo(0,0)}function complete(section,item){s[section][item]=true;persist();render()}function toast(t){const e=[...document.querySelectorAll('#feedback')].filter(x=>x.offsetParent!==null).pop();if(e)e.innerHTML=t}function opts(group,arr){return arr.map((x,i)=>'<label class="option"><input type="radio" name="'+group+'" value="'+i+'" '+(get(group)===String(i)?"checked":"")+' onchange="set(\''+group+'\',this.value)">'+esc(x)+'</label>').join("")}function blockTitle(n,name){return '<div class="row"><span class="eyebrow">'+n+'</span><span class="pill">'+name+'</span></div>'}
function bagBody(){const qVisited=!!s.visited.quake,mVisited=!!s.visited.museum;
let parts='<section><h3>最初的神祕委託</h3><p>一本記載六年故事的日誌，前五頁都有內容，第六頁卻消失了。</p><div class="notice">「想找到第六頁，先去尋找時間留下的痕跡。真相不是猜出來的，而是靠觀察與證據找回來的。」</div></section>';
if(qVisited){parts+='<section><h3>檔案001｜被撕裂的時間</h3><p>一份藏在腳下的大地，一份藏在曾經的教室。<b>先找出原因，再尋找結果。</b></p>';if(s.quake.a){parts+='<p class="pill">已辨認錯誤紀錄</p><p>你們確認了：地震搖晃也可能讓不在斷層線上的建築受損。</p>'}if(s.quake.b){parts+='<h4>修復的事件編碼卡</h4><div class="records"><div class="record"><b>7</b>校園設施受到破壞</div><div class="record"><b>2</b>斷層發生錯動</div><div class="record"><b>4</b>地層累積應力</div><div class="record"><b>9</b>地表變形與強烈搖晃</div></div><p class="small">編號是虛構的檔案編碼，不是地震數據。</p>'}else{parts+='<p class="small">事件編碼卡尚未修復。完成因果排序後解鎖。</p>'}parts+='<p>狀態：'+(s.quake.code?'🔓 已解鎖':'🔒 尚未解鎖')+'</p></section>'}
if(mVisited){parts+='<section><h3>檔案002｜失序的研究室</h3><p>「看見的未必就是全部的真相。觀察現象、閱讀資料，再確認哪些結論有證據支持。」</p><p>已取得印記：'+(s.museum.a?'🌊 海洋　':'')+(s.museum.b?'⚙️ 機械　':'')+(s.museum.c?'🦕 史前　':'')+(!s.museum.a&&!s.museum.b&&!s.museum.c?'尚未取得':'')+'</p>';if(s.museum.a)parts+='<p class="small">海洋證據：標本無法直接告訴我們所有深海生活行為。</p>';if(s.museum.b)parts+='<p class="small">機械證據：渾儀觀測、渾象模擬、報時木閣報時。</p>';if(s.museum.c)parts+='<p class="small">史前證據：共同埋藏不能直接證明親屬關係。</p>';parts+='</section>'}
parts+='<section><details><summary>老師設定・進度處理</summary><p class="small">資料只保存在目前這支手機的瀏覽器，其他隊不會同步。</p><button class="btn outline" onclick="if(confirm(\'確定要清除這台手機上的所有進度嗎？\')){localStorage.removeItem(KEY);location.reload()}">清除本機進度</button></details></section>';
document.getElementById("bagBody").innerHTML=parts}
let sequence=Array.isArray(s.answers.sortOrder)&&s.answers.sortOrder.length===4?s.answers.sortOrder:["D","B","A","C"];
function moveSort(i,dir){const j=i+dir;if(j<0||j>=4)return;[sequence[i],sequence[j]]=[sequence[j],sequence[i]];s.answers.sortOrder=sequence;persist();render()}
function sortHTML(){const labels={A:"地層累積應力",B:"斷層發生錯動",C:"地表變形與強烈搖晃",D:"校園設施受到破壞"};return '<div class="task">'+sequence.map((id,i)=>'<div class="row" style="margin:7px 0;background:white;border-radius:9px;padding:10px"><span>'+labels[id]+'</span><span><button aria-label="上移" onclick="moveSort('+i+',-1)" '+(i===0?'disabled':'')+'>↑</button> <button aria-label="下移" onclick="moveSort('+i+',1)" '+(i===3?'disabled':'')+'>↓</button></span></div>').join("")+'</div>'}
function sortCheck(){if(sequence.join("")!=="ABCD"){const e=document.querySelector("#sortArea");if(e)e.insertAdjacentHTML("afterend",'<p class="error">順序仍有矛盾，請重新調整事件卡。</p>');return}complete("quake","b")}
function render(){const app=document.getElementById("app");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));const sel={home:"navHome",quake:"nav921",museum:"navMuseum"}[s.current]||"navHome";document.getElementById(sel).classList.add("active");if(s.current==="quake")app.innerHTML=quake();else if(s.current==="museum")app.innerHTML=museum();else app.innerHTML=home();const sorting=document.getElementById("sortArea");if(sorting)sorting.innerHTML=sortHTML();bagBody()}
function home(){const q=s.quake.code,m=s.museum.a&&s.museum.b&&s.museum.c;return '<div class="hero"><span class="eyebrow" style="color:#cfdfbe">THE MISSING SIXTH PAGE</span><h2>消失的第六頁</h2><p>一本不知從哪裡出現的日誌，前五頁都有記錄，唯獨第六頁被撕掉了。<br>有人留下訊息：「第六頁不在書裡。它藏在你們即將踏上的旅程中。」</p></div><div class="card"><label>探索隊名稱（可選）</label><input value="'+esc(s.team)+'" placeholder="例如：第一探索隊" onchange="s.team=this.value;persist()"><p class="small">每支手機的資料各自儲存。導師用另一支手機開啟同一網址也不會互相影響。</p></div><div class="card"><div class="row"><h2>調查紀錄</h2><span class="pill">'+(Number(q)+Number(m))+'/2 站</span></div><div class="task '+(q?"done":"")+'"><div class="row"><strong>001｜921地震教育園區</strong><span>'+(q?"✅":"🔒")+'</span></div><p class="small">辨認錯誤紀錄 → 因果排序 → 4297 密碼</p><button class="btn alt" onclick="show(\'quake\')">'+(q?"查看已解鎖檔案":"進入第一站")+'</button></div><div class="task '+(m?"done":"")+'"><div class="row"><strong>002｜自然科學博物館</strong><span>'+(m?"✅":"🔒")+'</span></div><p class="small">大王魷魚・水運儀象臺・恐龍區，蒐集三枚研究印記</p><button class="btn alt" onclick="show(\'museum\')">'+(m?"查看已解鎖檔案":"進入第二站")+'</button></div></div><div class="card"><h3>旅程尚未結束</h3><p class="muted">優格餅乾學院與鹿港老街尚未加入。此版會保留前兩站進度，日後擴充也能繼續使用。</p></div>'}
function quake(){const q=s.quake;return '<div class="hero">'+blockTitle("調查檔案 001","第一站")+'<h2>被撕裂的時間</h2><p>1999年9月21日，一所學校留下了不尋常的痕跡。你們需要辨認有問題的紀錄，還原地震事件的因果，才能開啟被封存的日誌。</p><p class="small" style="color:#d7e5e6">請先跟隨領隊導覽，等適當時機再共同解題。</p></div><div class="card">'+blockTitle("任務01","辨認矛盾")+'<h2>誰改變了校園？</h2><p>根據斷層、操場與校舍的現場證據，下面哪份研究紀錄出現明顯錯誤？</p>'+opts("q1",["地表錯動可能讓原本連續的跑道產生高低落差。","校舍損壞程度不只與地震強弱有關，也可能受到斷層位置及建築結構影響。","只要校舍沒有直接位在斷層線上，就不會因地震受到結構破壞。"])+(q.a?'<div class="ok">✅ 已確認：斷層錯動與地震搖晃的影響不能混為一談。</div>':'<button class="btn" onclick="checkQuakeOne()">核對紀錄</button><div id="feedback"></div>')+'</div><div class="card">'+blockTitle("任務02","因果重建")+'<h2>重建事件順序</h2><p>將四張事件卡從原因到結果排成正確順序。可隨時打開背包查閱事件編號。</p><div id="sortArea"></div><p class="small">點擊 ↑ ↓ 調整順序。完成後，再到調查背包找到對應編碼。</p>'+(q.b?'<div class="ok">✅ 因果順序已確認。</div>':'<label>這四件事情的因果順序是否正確？請先和小組說明原因。</label><button class="btn" onclick="sortCheck()">確認因果順序</button>')+'</div><div class="card">'+blockTitle("最終密碼","四位數")+'<h2>重建時間的順序</h2><p>「先找出原因，再尋找結果。」調查背包裡有四張事件編碼卡，請依因果順序輸入四位密碼。</p>'+field("qcode","輸入四位數字")+(q.code?'<div class="ok">🔓 4297 正確。檔案001已找回！<p>時間能改變大地與建築，但留下的痕跡，能幫助後來的人理解過去。</p></div>':'<button class="btn" onclick="checkQuakeCode()">解鎖檔案001</button><div id="feedback"></div>')+'</div>'}
function checkQuakeOne(){if(get("q1")==="2")complete("quake","a");else toast('<p class="error">這份紀錄未必有問題。再想想斷層線以外的建築會不會因搖晃而損壞。</p>')}
function checkQuakeCode(){if(!s.quake.a||!s.quake.b)return toast('<p class="error">先完成兩項調查。</p>');if(read("qcode")==="4297")complete("quake","code");else toast('<p class="error">密碼尚未吻合。查看背包的事件編號與因果順序。</p>')}
function museum(){const m=s.museum;const count=Object.values(m).filter(Boolean).length;return '<div class="hero">'+blockTitle("調查檔案 002","第二站")+'<h2>失序的研究室</h2><p>一份研究報告的三處紀錄散落在海洋標本、古代機械與史前生物之間。找出證據，讓研究室重新運作！</p><p class="small" style="color:#d7e5e6">大王魷魚與水運儀象臺隨領隊觀察；恐龍區在指定範圍內尋物，最後於恐龍區集合。</p></div><div class="card"><div class="row"><b>研究印記</b><span class="pill">'+count+'/3</span></div><div class="progress"><div style="width:'+(count*100/3)+'%"></div></div><p class="small">🌊 海洋 '+(m.a?"✅":"◻️")+'　⚙️ 機械 '+(m.b?"✅":"◻️")+'　🦕 史前 '+(m.c?"✅":"◻️")+'</p></div><div class="card">'+blockTitle("任務 A","大王魷魚")+'<h2>誰在說謊？</h2><p>觀察大王魷魚標本及附近的說明牌，以下哪一份研究紀錄把尚未確認的推測當成了確定的事實？</p>'+opts("squid",["標本保存在液體中，能讓我們直接觀察牠的部分身體構造。","標本身上的吸盤、漏斗等構造，可以作為研究身體功能的線索。","因為標本保存完整，我們就能直接知道牠在深海中的所有生活行為。"])+(m.a?'<div class="ok">✅ 已取得「海洋研究印記」</div>':'<button class="btn" onclick="checkSquid()">確認海洋研究紀錄</button><div id="feedback"></div>')+'</div><div class="card">'+blockTitle("任務 B","水運儀象臺")+'<h2>失靈的天文鐘</h2><p>三項裝置的名稱不見了。請觀察水運儀象臺，閱讀說明牌，依據用途找回名稱。</p><label>① 上層：用來觀測天體位置的是什麼裝置？</label>'+field("mech1","輸入裝置名稱")+'<label>② 中層：用來模擬星空與天體運行的是什麼裝置？</label>'+field("mech2","輸入裝置名稱")+'<label>③ 下層：利用木人、鐘鼓等機構報時的部分叫什麼？</label>'+field("mech3","輸入裝置名稱")+(m.b?'<div class="ok">✅ 已取得「機械研究印記」</div>':'<button class="btn" onclick="checkMech()">修復機械紀錄</button><div id="feedback"></div>')+'<details><summary>需要提示嗎？</summary><p>按照上層觀測、中層模擬、下層報時的功能，逐一查看介紹。</p></details></div><div class="card">'+blockTitle("任務 C","恐龍區照片尋物")+'<h2>被隱藏的研究報告</h2><p>請在恐龍區尋找下圖對應的蛋巢與幼體展示，觀察模型與附近的介紹，再判讀調查紀錄。</p><img class="pic" src="https://web3.nmns.edu.tw/Exhibits/113/2024dinosaur/assets/images/brt-4-s-1-800x800.jpg" alt="指定的竊蛋龍蛋巢與幼體展品照片" onerror="this.style.display=\'none\';document.getElementById(\'photoFallback\').style.display=\'block\'"><div id="photoFallback" class="placeholder" style="display:none">🦕 尋找竊蛋龍與蛋巢展示<br><small>官方圖片目前無法載入，請點下方官方展品介紹</small></div><p class="small">圖片來源：國立自然科學博物館官方「有龍展示」<a href="https://web3.nmns.edu.tw/Exhibits/113/2024dinosaur/unit-4.html" target="_blank" rel="noopener">查看原頁</a>。照片載入需要網路。提醒：模型是復原場景，不能直接視為已證實的化石事實。</p><div class="task"><b>紀錄①</b><p>一件群體埋葬化石中，保存了不只一個個體的遺骸。</p><b>紀錄②</b><p>這些個體被一起埋藏，因此牠們生前可能有某種共同活動或關係。</p><b>紀錄③</b><p>這些個體一定是一家人，而且每天都一起生活。</p></div><label>哪一份紀錄把尚未證實的猜測當成了確定的事實？為什麼？</label>'+field("dinoReason","例如：紀錄__，因為……",true)+(m.c?'<div class="ok">✅ 已取得「史前研究印記」</div>':'<button class="btn" onclick="checkDino()">提交研究判斷</button><div id="feedback"></div><details><summary>老師確認（學生回答後再開啟）</summary><p>參考答案：紀錄③。一起埋藏不等於一定是家人，也不足以確定每天共同生活。</p><button class="btn alt" onclick="complete(\'museum\',\'c\')">老師確認回答合理，取得印記</button></details>')+'<p class="small">若現場沒有群體埋葬化石的說明，請改採模型觀察與口頭討論，老師可直接確認，勿讓學生為找該展品離開指定活動範圍。</p></div>'+(count===3?'<div class="card"><div class="success-illustration">📖✨</div><h2>檔案002｜研究報告修復成功</h2><p>你們從深海生物、古代機械與史前化石中找到了研究線索。</p><p>認識世界，不只是記住答案，更要仔細觀察、提出問題，並尋找證據。</p><div class="ok">第二份日誌已找回。第六頁的祕密，還有待揭曉……</div></div>':'<div class="card"><h3>等待最後的研究印記</h3><p>不需要額外文字密碼。三個任務完成後，第二份日誌會自動解鎖。</p></div>')}
function checkSquid(){if(get("squid")==="2")complete("museum","a");else toast('<p class="error">請區分「可以從標本觀察」與「無法只靠標本直接確定」。</p>')}
function checkMech(){const a=clean(read("mech1")),b=clean(read("mech2")),c=clean(read("mech3"));if(a.includes("渾儀")&&b.includes("渾象")&&(c.includes("報時木閣")||c.includes("報時閣")||c==="木閣"))complete("museum","b");else toast('<p class="error">仍有裝置名稱不符合。請再查閱上、中、下層的用途與標示。</p>')}
function checkDino(){const t=read("dinoReason");if(!t)return toast('<p class="error">請先寫下小組的判斷與理由。</p>');toast('<div class="notice">已記下小組回答。請由老師確認推論是否有依據，再按下方「老師確認」取得印記。</div>')}
render();
</script></body></html>
