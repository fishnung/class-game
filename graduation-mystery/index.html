<body><header><div class="top"><div><small>畢旅實境解謎・老師手機版</small><h1>消失的第六頁</h1></div><button onclick="openBag()">🎒 調查背包</button></div></header><main id="app" class="wrap"></main><div class="nav"><button id="navHome" onclick="show('home')">📖 日誌</button><button id="nav921" onclick="show('quake')">🌍 921</button><button id="navMuseum" onclick="show('museum')">🔬 科博館</button><button id="navCookie" onclick="show('cookie')">🍪 餅乾</button><button id="navLukang" onclick="show('lukang')">🏘️ 鹿港</button></div><div class="bag" id="bag" onclick="if(event.target===this)closeBag()"><div class="sheet"><div class="row"><h2>🎒 調查背包</h2><button class="close" onclick="closeBag()">關閉 ×</button></div><div id="bagBody"></div></div></div>
<script>
const KEY="missing-page-v1";const defaults={team:"",quake:{a:false,b:false,code:false},museum:{a:false,b:false,c:false},cookie:{a:false,b:false},lukang:{a:false,b:false,c:false,final:false},ending:{solved:false,revealed:false,note:""},history:[],current:"home",answers:{},reveal:false};
let s;try{s=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){s=JSON.parse(JSON.stringify(defaults))}s={...JSON.parse(JSON.stringify(defaults)),...s};s.quake={...defaults.quake,...s.quake};s.museum={...defaults.museum,...s.museum};s.cookie={...defaults.cookie,...(s.cookie||{})};s.lukang={...defaults.lukang,...(s.lukang||{})};s.ending={...defaults.ending,...(s.ending||{})};s.history=Array.isArray(s.history)?s.history:[];s.answers=s.answers||{};s.visited={quake:false,museum:false,cookie:false,lukang:false,...(s.visited||{})};
function logEvent(kind,detail){if(!Array.isArray(s.history))s.history=[];s.history.push({at:new Date().toISOString(),kind:String(kind),detail:String(detail||"")});if(s.history.length>500)s.history=s.history.slice(-500)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function get(k){return s.answers[k]||""}function set(k,v){s.answers[k]=v;persist()}function field(k,placeholder="",multi=false){return multi?'<textarea id="'+k+'" placeholder="'+esc(placeholder)+'">'+esc(get(k))+'</textarea>':'<input id="'+k+'" autocomplete="off" placeholder="'+esc(placeholder)+'" value="'+esc(get(k))+'">'}function read(k){const el=document.getElementById(k);if(el)set(k,el.value);return get(k).replace(/\s/g,"").trim()}function clean(v){return String(v).trim().replace(/[\s，,。．、]/g,"").replace(/臺/g,"台")}function openBag(){bagBody();document.getElementById("bag").classList.add("open")}function closeBag(){document.getElementById("bag").classList.remove("open")}function allFour(){return !!(s.quake.code&&s.museum.a&&s.museum.b&&s.museum.c&&s.cookie.a&&s.cookie.b&&s.lukang.final)}function show(k){if(k==="ending"&&!allFour()){s.current="home";persist();render();return}const changed=s.current!==k;s.current=k;if(["quake","museum","cookie","lukang"].includes(k))s.visited[k]=true;if(changed)logEvent("進入地點",({home:"調查首頁",quake:"921地震教育園區",museum:"自然科學博物館",cookie:"優格餅乾學院",lukang:"鹿港老街",ending:"最終章"}[k]||k));persist();render();scrollTo(0,0)}function complete(section,item){if(!s[section][item]){logEvent("完成任務",taskNames[section+"."+item]||section+" "+item);s[section][item]=true}persist();render()}function toast(t){const e=[...document.querySelectorAll('#feedback')].filter(x=>x.offsetParent!==null).pop();if(e)e.innerHTML=t}function opts(group,arr){return arr.map((x,i)=>'<label class="option"><input type="radio" name="'+group+'" value="'+i+'" '+(get(group)===String(i)?"checked":"")+' onchange="set(\''+group+'\',this.value)">'+esc(x)+'</label>').join("")}function blockTitle(n,name){return '<div class="row"><span class="eyebrow">'+n+'</span><span class="pill">'+name+'</span></div>'}
function bagBody(){const qVisited=!!s.visited.quake,mVisited=!!s.visited.museum;
let parts='<section><h3>最初的神祕委託</h3><p>一本記載六年故事的日誌，前五頁都有內容，第六頁卻消失了。</p><div class="notice">「想找到第六頁，先去尋找時間留下的痕跡。真相不是猜出來的，而是靠觀察與證據找回來的。」</div></section>';
if(qVisited){parts+='<section><h3>檔案001｜被撕裂的時間</h3><p>一份藏在腳下的大地，一份藏在曾經的教室。<b>先找出原因，再尋找結果。</b></p>';if(s.quake.a){parts+='<p class="pill">已辨認錯誤紀錄</p><p>你們確認了：地震搖晃也可能讓不在斷層線上的建築受損。</p>'}if(s.quake.b){parts+='<h4>修復的事件編碼卡</h4><div class="records"><div class="record"><b>7</b>校園設施受到破壞</div><div class="record"><b>2</b>斷層發生錯動</div><div class="record"><b>4</b>地層累積應力</div><div class="record"><b>9</b>地表變形與強烈搖晃</div></div><p class="small">編號是虛構的檔案編碼，不是地震數據。</p>'}else{parts+='<p class="small">事件編碼卡尚未修復。完成因果排序後解鎖。</p>'}parts+='<p>狀態：'+(s.quake.code?'🔓 已解鎖':'🔒 尚未解鎖')+'</p></section>'}
if(mVisited){parts+='<section><h3>檔案002｜失序的研究室</h3><p>「看見的未必就是全部的真相。觀察現象、閱讀資料，再確認哪些結論有證據支持。」</p><p>已取得印記：'+(s.museum.a?'🌊 海洋　':'')+(s.museum.b?'⚙️ 機械　':'')+(s.museum.c?'🦕 史前　':'')+(!s.museum.a&&!s.museum.b&&!s.museum.c?'尚未取得':'')+'</p>';if(s.museum.a)parts+='<p class="small">海洋證據：標本無法直接告訴我們所有深海生活行為。</p>';if(s.museum.b)parts+='<p class="small">機械證據：渾儀觀測、渾象模擬、報時木閣報時。</p>';if(s.museum.c)parts+='<p class="small">史前證據：共同埋藏不能直接證明親屬關係。</p>';parts+='</section>'}
if(s.visited.cookie){parts+='<section><h3>檔案003｜消失的魔法配方</h3><p>餅乾學院的配方遭到竄改。</p>';if(s.cookie.a)parts+='<p>🍪 歷史線索：烘焙研發與代工經驗，發展成今日的餅乾學院。</p>';if(s.cookie.b)parts+='<p>🍪 DIY線索：厚度相近的麵團，更容易烘烤均勻。</p>';if(!s.cookie.a&&!s.cookie.b)parts+='<p>目前尚未取得線索。</p>';parts+='</section>'}
if(s.visited.lukang){parts+='<section><h3>檔案004｜老街時光密語</h3><p>找到線索的順序，不一定是解除封印的順序。</p><div class="records">'+(s.lukang.a?'<div class="record"><b>⛵</b>船｜交易</div>':'')+(s.lukang.b?'<div class="record"><b>💧</b>井水｜分享</div>':'')+(s.lukang.c?'<div class="record"><b>🏠</b>門楣｜祝福</div>':'')+'</div>';if(s.lukang.c)parts+='<p>三槐挺秀：三槐源自槐樹象徵仕宦的典故，亦與王氏堂號相關；挺秀表示出眾，寄託後代成材的願望。</p>';if(!s.lukang.a&&!s.lukang.b&&!s.lukang.c)parts+='<p>尚未取得圖像印記。</p>';parts+='</section>'}
if(allFour()){parts+='<section><h3>✨ 最終檔案｜第六頁</h3><p>'+(s.ending.revealed?'第六頁已找回，你們的故事仍會繼續。':'四份日誌已集齊，最後一個封印正在等待破解。')+'</p><button class="btn" onclick="closeBag();show(\'ending\')">查看最終檔案</button></section>'}
parts+='<section><details><summary>老師設定・進度處理</summary><p class="small">資料只保存在目前這支手機的瀏覽器，其他隊不會同步。</p><button class="btn outline" onclick="if(confirm(\'確定要清除這台手機上的所有進度嗎？\')){localStorage.removeItem(KEY);location.reload()}">清除本機進度</button></details></section>';
document.getElementById("bagBody").innerHTML=parts}
let sequence=Array.isArray(s.answers.sortOrder)&&s.answers.sortOrder.length===4?s.answers.sortOrder:["D","B","A","C"];
function moveSort(i,dir){const j=i+dir;if(j<0||j>=4)return;[sequence[i],sequence[j]]=[sequence[j],sequence[i]];s.answers.sortOrder=sequence;persist();render()}
function sortHTML(){const labels={A:"地層累積應力",B:"斷層發生錯動",C:"地表變形與強烈搖晃",D:"校園設施受到破壞"};return '<div class="task">'+sequence.map((id,i)=>'<div class="row" style="margin:7px 0;background:white;border-radius:9px;padding:10px"><span>'+labels[id]+'</span><span><button aria-label="上移" onclick="moveSort('+i+',-1)" '+(i===0?'disabled':'')+'>↑</button> <button aria-label="下移" onclick="moveSort('+i+',1)" '+(i===3?'disabled':'')+'>↓</button></span></div>').join("")+'</div>'}
function sortCheck(){if(sequence.join("")!=="ABCD"){const e=document.querySelector("#sortArea");if(e)e.insertAdjacentHTML("afterend",'<p class="error">順序仍有矛盾，請重新調整事件卡。</p>');return}complete("quake","b")}
function render(){const app=document.getElementById("app");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));const sel={home:"navHome",quake:"nav921",museum:"navMuseum",cookie:"navCookie",lukang:"navLukang"}[s.current]||"navHome";document.getElementById(sel).classList.add("active");if(s.current==="quake")app.innerHTML=quake();else if(s.current==="museum")app.innerHTML=museum();else if(s.current==="cookie")app.innerHTML=cookie();else if(s.current==="lukang")app.innerHTML=lukang();else if(s.current==="ending")app.innerHTML=ending();else app.innerHTML=home();const sorting=document.getElementById("sortArea");if(sorting)sorting.innerHTML=sortHTML();const street=document.getElementById("streetSort");if(street)street.innerHTML=streetSortHTML();bagBody()}
function home(){const q=s.quake.code,m=s.museum.a&&s.museum.b&&s.museum.c,c=s.cookie.a&&s.cookie.b,l=s.lukang.final;return '<div class="hero"><span class="eyebrow" style="color:#cfdfbe">THE MISSING SIXTH PAGE</span><h2>消失的第六頁</h2><p>一本不知從哪裡出現的日誌，前五頁都有記錄，唯獨第六頁被撕掉了。<br>有人留下訊息：「第六頁不在書裡。它藏在你們即將踏上的旅程中。」</p></div><div class="card"><label>探索隊名稱（可選）</label><input value="'+esc(s.team)+'" placeholder="例如：第一探索隊" onchange="s.team=this.value;persist()"><p class="small">每支手機的資料各自儲存。導師用另一支手機開啟同一網址也不會互相影響。</p></div><div class="card"><div class="row"><h2>調查紀錄</h2><span class="pill">'+(Number(q)+Number(m)+Number(c)+Number(l))+'/4 站</span></div><div class="task '+(q?"done":"")+'"><div class="row"><strong>001｜921地震教育園區</strong><span>'+(q?"✅":"🔒")+'</span></div><p class="small">辨認錯誤紀錄 → 因果排序 → 4297 密碼</p><button class="btn alt" onclick="show(\'quake\')">'+(q?"查看已解鎖檔案":"進入第一站")+'</button></div><div class="task '+(m?"done":"")+'"><div class="row"><strong>002｜自然科學博物館</strong><span>'+(m?"✅":"🔒")+'</span></div><p class="small">大王魷魚・水運儀象臺・恐龍區，蒐集三枚研究印記</p><button class="btn alt" onclick="show(\'museum\')">'+(m?"查看已解鎖檔案":"進入第二站")+'</button></div><div class="task '+(c?"done":"")+'"><strong>003｜優格餅乾學院 '+(c?"✅":"🔒")+'</strong><p class="small">學院歷史、DIY烘焙</p><button class="btn alt" onclick="show(\'cookie\')">進入第三站</button></div><div class="task '+(l?"done":"")+'"><strong>004｜鹿港老街 '+(l?"✅":"🔒")+'</strong><p class="small">尋找半邊井、三槐挺秀，破解圖像密碼</p><button class="btn alt" onclick="show(\'lukang\')">進入第四站</button></div></div><div class="card"><h3>旅程尚未結束</h3><p class="muted">'+(q&&m&&c&&l?'<div class="task done"><div class="row"><strong>最終章｜從來沒有消失的第六頁</strong><span>✨</span></div><p class="small">重新排列四份日誌，揭開最後的謎題。</p><button class="btn" onclick="show(\'ending\')">進入最終章</button></div><p class="small">所有站點已完成，第六頁正在等你們。</p>':'四站任務全部完成後，才會開啟最後一份神祕檔案。')+'</p></div>'}
function quake(){const q=s.quake;return '<div class="hero">'+blockTitle("調查檔案 001","第一站")+'<h2>被撕裂的時間</h2><p>1999年9月21日，一所學校留下了不尋常的痕跡。你們需要辨認有問題的紀錄，還原地震事件的因果，才能開啟被封存的日誌。</p><p class="small" style="color:#d7e5e6">請先跟隨領隊導覽，等適當時機再共同解題。</p></div><div class="card">'+blockTitle("任務01","辨認矛盾")+'<h2>誰改變了校園？</h2><p>根據斷層、操場與校舍的現場證據，下面哪份研究紀錄出現明顯錯誤？</p>'+opts("q1",["地表錯動可能讓原本連續的跑道產生高低落差。","校舍損壞程度不只與地震強弱有關，也可能受到斷層位置及建築結構影響。","只要校舍沒有直接位在斷層線上，就不會因地震受到結構破壞。"])+(q.a?'<div class="ok">✅ 已確認：斷層錯動與地震搖晃的影響不能混為一談。</div>':'<button class="btn" onclick="checkQuakeOne()">核對紀錄</button><div id="feedback"></div>')+'</div><div class="card">'+blockTitle("任務02","因果重建")+'<h2>重建事件順序</h2><p>將四張事件卡從原因到結果排成正確順序。可隨時打開背包查閱事件編號。</p><div id="sortArea"></div><p class="small">點擊 ↑ ↓ 調整順序。完成後，再到調查背包找到對應編碼。</p>'+(q.b?'<div class="ok">✅ 因果順序已確認。</div>':'<label>這四件事情的因果順序是否正確？請先和小組說明原因。</label><button class="btn" onclick="sortCheck()">確認因果順序</button>')+'</div><div class="card">'+blockTitle("最終密碼","四位數")+'<h2>重建時間的順序</h2><p>「先找出原因，再尋找結果。」調查背包裡有四張事件編碼卡，請依因果順序輸入四位密碼。</p>'+field("qcode","輸入四位數字")+(q.code?'<div class="ok">🔓 4297 正確。檔案001已找回！<p>時間能改變大地與建築，但留下的痕跡，能幫助後來的人理解過去。</p></div>':'<button class="btn" onclick="checkQuakeCode()">解鎖檔案001</button><div id="feedback"></div>')+'</div>'}
function checkQuakeOne(){if(get("q1")==="2")complete("quake","a");else toast('<p class="error">這份紀錄未必有問題。再想想斷層線以外的建築會不會因搖晃而損壞。</p>')}
function checkQuakeCode(){if(!s.quake.a||!s.quake.b)return toast('<p class="error">先完成兩項調查。</p>');if(read("qcode")==="4297")complete("quake","code");else toast('<p class="error">密碼尚未吻合。查看背包的事件編號與因果順序。</p>')}
function museum(){const m=s.museum;const count=Object.values(m).filter(Boolean).length;return '<div class="hero">'+blockTitle("調查檔案 002","第二站")+'<h2>失序的研究室</h2><p>一份研究報告的三處紀錄散落在海洋標本、古代機械與史前生物之間。找出證據，讓研究室重新運作！</p><p class="small" style="color:#d7e5e6">大王魷魚與水運儀象臺隨領隊觀察；恐龍區在指定範圍內尋物，最後於恐龍區集合。</p></div><div class="card"><div class="row"><b>研究印記</b><span class="pill">'+count+'/3</span></div><div class="progress"><div style="width:'+(count*100/3)+'%"></div></div><p class="small">🌊 海洋 '+(m.a?"✅":"◻️")+'　⚙️ 機械 '+(m.b?"✅":"◻️")+'　🦕 史前 '+(m.c?"✅":"◻️")+'</p></div><div class="card">'+blockTitle("任務 A","大王魷魚")+'<h2>誰在說謊？</h2><p>觀察大王魷魚標本及附近的說明牌，以下哪一份研究紀錄把尚未確認的推測當成了確定的事實？</p>'+opts("squid",["標本保存在液體中，能讓我們直接觀察牠的部分身體構造。","標本身上的吸盤、漏斗等構造，可以作為研究身體功能的線索。","因為標本保存完整，我們就能直接知道牠在深海中的所有生活行為。"])+(m.a?'<div class="ok">✅ 已取得「海洋研究印記」</div>':'<button class="btn" onclick="checkSquid()">確認海洋研究紀錄</button><div id="feedback"></div>')+'</div><div class="card">'+blockTitle("任務 B","水運儀象臺")+'<h2>失靈的天文鐘</h2><p>三項裝置的名稱不見了。請觀察水運儀象臺，閱讀說明牌，依據用途找回名稱。</p><label>① 上層：用來觀測天體位置的是什麼裝置？</label>'+field("mech1","輸入裝置名稱")+'<label>② 中層：用來模擬星空與天體運行的是什麼裝置？</label>'+field("mech2","輸入裝置名稱")+'<label>③ 下層：利用木人、鐘鼓等機構報時的部分叫什麼？</label>'+field("mech3","輸入裝置名稱")+(m.b?'<div class="ok">✅ 已取得「機械研究印記」</div>':'<button class="btn" onclick="checkMech()">修復機械紀錄</button><div id="feedback"></div>')+'<details><summary>需要提示嗎？</summary><p>按照上層觀測、中層模擬、下層報時的功能，逐一查看介紹。</p></details></div><div class="card">'+blockTitle("任務 C","恐龍區照片尋物")+'<h2>被隱藏的研究報告</h2><p>請在恐龍區尋找下圖對應的蛋巢與幼體展示，觀察模型與附近的介紹，再判讀調查紀錄。</p><img class="pic" src="https://web3.nmns.edu.tw/Exhibits/113/2024dinosaur/assets/images/brt-4-s-1-800x800.jpg" alt="指定的竊蛋龍蛋巢與幼體展品照片" onerror="this.style.display=\'none\';document.getElementById(\'photoFallback\').style.display=\'block\'"><div id="photoFallback" class="placeholder" style="display:none">🦕 尋找竊蛋龍與蛋巢展示<br><small>官方圖片目前無法載入，請點下方官方展品介紹</small></div><p class="small">圖片來源：國立自然科學博物館官方「有龍展示」<a href="https://web3.nmns.edu.tw/Exhibits/113/2024dinosaur/unit-4.html" target="_blank" rel="noopener">查看原頁</a>。照片載入需要網路。提醒：模型是復原場景，不能直接視為已證實的化石事實。</p><div class="task"><b>紀錄①</b><p>一件群體埋葬化石中，保存了不只一個個體的遺骸。</p><b>紀錄②</b><p>這些個體被一起埋藏，因此牠們生前可能有某種共同活動或關係。</p><b>紀錄③</b><p>這些個體一定是一家人，而且每天都一起生活。</p></div><label>哪一份紀錄把尚未證實的猜測當成了確定的事實？為什麼？</label>'+field("dinoReason","例如：紀錄__，因為……",true)+(m.c?'<div class="ok">✅ 已取得「史前研究印記」</div>':'<button class="btn" onclick="checkDino()">提交研究判斷</button><div id="feedback"></div><details><summary>老師確認（學生回答後再開啟）</summary><p>參考答案：紀錄③。一起埋藏不等於一定是家人，也不足以確定每天共同生活。</p><button class="btn alt" onclick="complete(\'museum\',\'c\')">老師確認回答合理，取得印記</button></details>')+'<p class="small">若現場沒有群體埋葬化石的說明，請改採模型觀察與口頭討論，老師可直接確認，勿讓學生為找該展品離開指定活動範圍。</p></div>'+(count===3?'<div class="card"><div class="success-illustration">📖✨</div><h2>檔案002｜研究報告修復成功</h2><p>你們從深海生物、古代機械與史前化石中找到了研究線索。</p><p>認識世界，不只是記住答案，更要仔細觀察、提出問題，並尋找證據。</p><div class="ok">第二份日誌已找回。第六頁的祕密，還有待揭曉……</div></div>':'<div class="card"><h3>等待最後的研究印記</h3><p>不需要額外文字密碼。三個任務完成後，第二份日誌會自動解鎖。</p></div>')}

function cookie(){const c=s.cookie;return '<div class="hero">'+blockTitle("神祕日誌003","第三站")+'<h2>消失的魔法配方</h2><p>貓頭鷹校長的配方被改寫了！聽完導覽、完成DIY後，回答兩個小問題就能修復。</p></div><div class="card">'+blockTitle("任務A","學院歷史")+'<h2>被改寫的學院歷史</h2><p>哪份紀錄最符合餅乾學院的發展歷史？</p>'+opts("cookieA",["最初專門開設餅乾DIY課程，後來才開始替其他食品品牌生產餅乾。","先累積餅乾研發與代工經驗，後來成立餅乾學院，讓民眾認識烘焙知識。","最初是以農產品種植為主，成立餅乾學院後才開始發展食品製造。"])+(c.a?'<div class="ok">✅ 答對了！台灣優格先累積烘焙研發與代工經驗，後來才成立餅乾學院，讓更多人認識餅乾製作與烘焙知識。</div>':'<button class="btn" onclick="checkCookieA()">確認學院紀錄</button>')+'<div id="cookieMsgA"></div></div><div class="card">'+blockTitle("任務B","DIY 推理")+'<h2>魔法配方出了什麼問題？</h2><p>如果餅乾麵團厚薄不一，怎麼做比較能讓它們烘烤均勻？</p>'+opts("cookieB",["將麵團盡量擀成接近的厚度，再進行壓模。","把較厚的餅乾放在烤盤中央，就能確保全部熟度相同。","只要使用相同形狀的模具，餅乾厚薄就不會影響烘烤結果。"])+(c.b?'<div class="ok">✅ 答對了！厚薄不同的餅乾，烤熟需要的時間可能不同。讓厚度接近，可減少有的烤焦、有的還沒熟。</div>':'<button class="btn" onclick="checkCookieB()">確認配方</button>')+'<div id="cookieMsgB"></div></div>'+(c.a&&c.b?'<div class="card"><div class="success-illustration">🍪📖</div><h2>檔案003｜配方修復成功</h2><p>一塊餅乾的誕生，需要材料、經驗，也需要不斷嘗試與調整。</p><div class="ok">第三份日誌已找回！</div></div>':'<div class="card"><h3>配方修復中</h3><p>兩題完成後，第三份日誌就會自動解鎖。</p></div>')}
function msg(id,t){if(id!=="endingCopy") {const label=attemptNames[id];if(label)logEvent("需要再嘗試",label);persist()}const e=document.getElementById(id);if(e)e.innerHTML='<p class="error">'+t+'</p>'}
function checkCookieA(){get("cookieA")==="1"?complete("cookie","a"):msg("cookieMsgA","想一想，學院成立之前已經有什麼烘焙經驗？")}
function checkCookieB(){get("cookieB")==="0"?complete("cookie","b"):msg("cookieMsgB","厚薄不同的麵團，烤熟所需的時間會一樣嗎？")}
let streetOrder=Array.isArray(s.answers.streetOrder)&&s.answers.streetOrder.length===3?s.answers.streetOrder:["ship","well","door"];
function moveStreet(i,delta){const j=i+delta;if(j<0||j>2)return;[streetOrder[i],streetOrder[j]]=[streetOrder[j],streetOrder[i]];s.answers.streetOrder=streetOrder;persist();render()}
function streetSortHTML(){const names={ship:"⛵ 船｜交易",well:"💧 井水｜分享",door:"🏠 門楣｜祝福"};return '<div class="task">'+streetOrder.map((id,i)=>'<div class="row" style="background:white;border-radius:12px;padding:12px;margin:8px 0"><span><b>'+names[id]+'</b></span><span><button aria-label="上移" onclick="moveStreet('+i+',-1)" '+(i===0?'disabled':'')+'>↑</button> <button aria-label="下移" onclick="moveStreet('+i+',1)" '+(i===2?'disabled':'')+'>↓</button></span></div>').join("")+'</div>'}
function checkStreetA(){get("streetA")==="0"?complete("lukang","a"):msg("streetMsgA","想想昔日鹿港的水運與街屋生意如何相連。")}
function checkStreetB(){get("streetB")==="1"?complete("lukang","b"):msg("streetMsgB","看看井與牆的位置，牆外的人能取水嗎？")}

  const noteLines=wrap(note,R-74,"29px sans-serif");
  const noteH=Math.max(165,noteLines.length*46+85);
  bg(P,y,R,noteH,"#eee0c4",18);y+=31;
  text("PAGE 006｜"+(s.team.trim()||"我們的探索隊"),P+29,y,"bold 26px sans-serif","#775a3d");y+=54;
  for(const row of noteLines){text(row,P+29,y,"29px sans-serif","#4b3c2e");y+=46}
  y+=noteH-(noteLines.length*46+85)+45;
  line();
 }
 title("解謎時間軸"+(historyImagePageCount()>1?"（第 "+(pageIndex+1)+"／"+historyImagePageCount()+" 張）":""));
 const ev=s.history.slice(pageIndex*42,(pageIndex+1)*42);
 if(!ev.length){paragraph("這版遊戲啟用歷程記錄後才開始記錄操作。舊進度仍有完成狀態，但沒有過去每次點擊的實際時間。",P,R,"24px sans-serif");y+=15}
 else for(const e of ev){
  paragraph(reportTime(e.at)+"｜"+e.kind,P,R,"22px sans-serif","#836b4d",35);
  paragraph(e.detail,P+20,R-20,"24px sans-serif","#4b4237",38);
  y+=17;
 }
 y+=27;
 paragraph("紀錄儲存於此手機；不同小隊不互相同步。",P,R,"21px sans-serif","#8a785f",32);
 return Math.ceil(y+70);
}
function saveHistoryPNG(page=0){
 if(!s.ending.revealed||!allFour())return;
 const total=historyImagePageCount();
 if(page<0||page>=total)return;
 const measure=document.createElement("canvas");measure.width=1080;measure.height=1;
 const m=measure.getContext("2d");if(!m){alert("此瀏覽器無法建立圖片，請使用列印功能。");return}
 const height=paintHistory(m,page);
 const result=document.createElement("canvas");result.width=1080;result.height=Math.min(height,15000);
 const ctx=result.getContext("2d");paintHistory(ctx,page);
 const fileName="消失的第六頁_遊玩歷程_"+safeFileName(s.team.trim()||"探索隊")+(total>1?"_"+(page+1):"")+".png";
 const a=document.createElement("a");a.download=fileName;a.href=result.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();
 if(total>1){const el=document.getElementById("historyImagePages");if(el)el.innerHTML='<p class="small">完整時間軸共分成 '+total+' 張圖片，請逐張儲存：</p>'+Array.from({length:total},(_,i)=>'<button class="btn alt" onclick="saveHistoryPNG('+i+')">儲存第 '+(i+1)+' 張／共 '+total+' 張</button>').join("")}
}
