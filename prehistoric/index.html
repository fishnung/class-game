<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>史前生存大冒險</title>
<style>
:root{--bg:#f5efe2;--card:#fffdf8;--ink:#2f352f;--muted:#697169;--line:#d8d0bf;--green:#4d7d6d;--gold:#a5764d;--purple:#8067a4;--life:#b85c4a;--tech:#4b6f97;--social:#8067a4}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.w{max-width:960px;margin:auto;padding:16px}.hero{font-size:clamp(30px,5vw,46px);font-weight:900;margin-top:8px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0}.story{background:#fbf4e4;border-left:5px solid var(--gold);padding:15px;border-radius:10px;line-height:1.75}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.group,.opt{border:2px solid var(--line);border-radius:16px;background:#fff;text-align:left;padding:16px}.group{text-align:center;font-weight:900;font-size:20px}.group small{display:block;font-size:14px;color:var(--muted);margin-top:6px}.opt.sel{border-color:var(--green);background:#eef6f2}.opt h3{margin:0 0 6px}.opt p{margin:0 0 8px;color:var(--muted);line-height:1.55}.btn{border:0;border-radius:12px;padding:12px 17px;background:var(--green);color:#fff;font-weight:900}.btn[disabled]{opacity:.45;cursor:not-allowed}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:999px;background:#eee7da;font-weight:700;font-size:14px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.score{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;text-align:center}.score b{display:block;font-size:32px}.score.life b{color:var(--life)}.score.tech b{color:var(--tech)}.score.social b{color:var(--social)}.hidden{display:none}.history{display:grid;gap:10px}.history .row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;line-height:1.6}.center{text-align:center}.delta{font-weight:800}.question{padding:13px 15px;background:#f5f0e6;border-radius:12px;margin:8px 0;line-height:1.65}
@media(max-width:680px){.grid,.scores,.groups{grid-template-columns:1fr}}
</style>
</head>
<body><div class="w">
<div class="hero">🏕️ 史前生存大冒險</div><p class="muted">島嶼部落的萬年生存記｜國小五年級體驗版</p>
<section id="start" class="card"><h2>你們就是史前人。</h2><p>每關有 <b>4 點人力</b>，每個行動花 2 點，所以每一階段只能選兩個。以前學會的東西，有些會影響後面的發展。</p><p><b>先選你們的組別：</b></p><div class="groups"><button class="group" data-g="1">第 1 組<small>🌊 海風部落</small></button><button class="group" data-g="2">第 2 組<small>🦌 山鹿部落</small></button><button class="group" data-g="3">第 3 組<small>🔥 岩火部落</small></button></div></section>
<section id="play" class="hidden"></section><section id="final" class="hidden"></section>
</div>
<script>
(()=>{
const S={group:0,tribe:'',score:{life:0,tech:0,social:0},badges:[],history:[]};
const names={1:'海風部落',2:'山鹿部落',3:'岩火部落'};
const rounds=[
{icon:'🌊',title:'海邊洞穴的生存挑戰',story:'你們住在臺灣東部靠海的洞穴附近。沒有農田、商店、冰箱。海邊有魚蝦貝類，森林有植物和動物。天氣變冷了，你們要把人力用在哪兩件事？',o:[
['stone','🪨 敲製石器','敲擊石頭，做出有鋒利邊緣的工具。','🛠️+2 🍖+1',{tech:2,life:1},'打製石器'],
['fire','🔥 取得火源','找到可以利用的火源，再想辦法保存火種，用來取暖與烤食物。','🍖+2 🛠️+1',{life:2,tech:1},'用火'],
['shore','🐟 海邊找食物','捕魚、撿貝類、採集海邊食物。','🍖+3',{life:3},null],
['hunt','🐗 森林狩獵採集','合作追蹤動物，也採集可食用植物。','🍖+2 👥+1',{life:2,social:1},null]
]},
{icon:'🌾',title:'平原上的新生活',story:'又過了很久。你們開始種植作物、飼養動物，也住得更固定。生活變穩定後，人們不只要處理食物與工具，也會花時間做一些不能直接增加食物的事。你們要把人力投入哪兩件事？',o:[
['farm','🌾 農耕與飼養','種植作物，也開始飼養動物。','🍖+3；有打製石器再🛠️+1',{life:3},'農耕生活'],
['polish','🪨 磨製石器','把石器磨得更適合生活與農耕。','🛠️+2 🍖+1',{tech:2,life:1},'磨製石器'],
['pot','🏺 製作陶器','挖黏土、塑形，再用高溫燒硬，用來保存物品。','🛠️+2 🍖+1；有用火再🛠️+1',{tech:2,life:1},'陶器'],
['settle','🏘️ 建立固定聚落','合作蓋房屋、整理生活空間。','👥+2 🍖+1；有農耕再👥+1',{social:2,life:1},'聚落'],
['jade','💎 製作精美玉器','花很多時間磨製漂亮而細緻的玉器。它不能直接增加食物。','👥+3',{social:3},'玉器'],
['burial','🪦 安排墓葬','用石板等材料安葬過世的族人，也可能放入一些物品。','👥+3',{social:3},'墓葬']
]},
{icon:'⚒️',title:'大聚落的新技術',story:'聚落已經更大。石頭工具雖然能用，但大量農事很花力氣。有人學會利用高溫處理金屬材料。你們要投入哪兩件事？',o:[
['iron','🔥 研究高溫煉鐵','研究爐火與材料，學習製作鐵器。','🛠️+3',{tech:3},'煉鐵技術'],
['tools','⛏️ 製作鐵製工具','做更耐用的工具幫助農耕。','🛠️+2 🍖+1；有煉鐵再🍖+2',{tech:2,life:1},'鐵農具'],
['morefarm','🌾 擴大農業生產','投入更多人力耕作。','🍖+3；有鐵農具再🍖+1',{life:3},null],
['moretown','🏘️ 擴大聚落','整理房屋、物資與合作。','👥+2 🍖+1',{social:2,life:1},null]
]}
];
const add=x=>Object.entries(x||{}).forEach(([k,v])=>S.score[k]+=v);
function bonus(id){if(id==='farm'&&S.badges.includes('打製石器'))return{tech:1};if(id==='pot'&&S.badges.includes('用火'))return{tech:1};if(id==='settle'&&S.badges.includes('農耕生活'))return{social:1};if(id==='tools'&&S.badges.includes('煉鐵技術'))return{life:2};if(id==='morefarm'&&S.badges.includes('鐵農具'))return{life:1};return null}
function scoreBlock(){return `<div class="scores"><div class="score life">🍖 生存與生產<b>${S.score.life}</b></div><div class="score tech">🛠️ 技術<b>${S.score.tech}</b></div><div class="score social">👥 社會與文化<b>${S.score.social}</b></div></div>`}
function renderRound(i){const r=rounds[i];let chosen=[];play.innerHTML=`<div class="card"><h2>${r.icon} ${r.title}</h2><p class="muted">第 ${S.group} 組｜${S.tribe}</p>${scoreBlock()}<div class="story">${r.story}</div><p><span class="chip">⚡ 4 點人力</span> <span class="chip">每項 2 點</span> <span class="chip">選 2 項</span></p><div class="grid">${r.o.map((x,j)=>`<button class="opt" data-id="${x[0]}"><h3>${String.fromCharCode(65+j)}. ${x[1]}</h3><p>${x[2]}</p><b>${x[3]}</b></button>`).join('')}</div><p class="center">已選 <b id="cnt">0</b>/2</p><p class="center"><button id="ok" class="btn" disabled>確認這一關</button></p></div>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(chosen.includes(id)){chosen=chosen.filter(x=>x!==id);b.classList.remove('sel')}else if(chosen.length<2){chosen.push(id);b.classList.add('sel')}cnt.textContent=chosen.length;ok.disabled=chosen.length!==2});
ok.onclick=()=>{const before={...S.score};const labels=[];chosen.forEach(id=>{const x=r.o.find(a=>a[0]===id);labels.push(x[1]);add(x[4]);add(bonus(id));if(x[5]&&!S.badges.includes(x[5]))S.badges.push(x[5])});const after={...S.score};S.history.push({stage:i+1,title:r.title,labels,before,after,ids:[...chosen]});showStageResult(i);}}
function showStageResult(i){const h=S.history[S.history.length-1];const d={life:h.after.life-h.before.life,tech:h.after.tech-h.before.tech,social:h.after.social-h.before.social};play.innerHTML=`<div class="card"><h2>✅ 第 ${i+1} 階段完成</h2><p><b>你們剛才選了：</b>${h.labels.join('、')}</p>${scoreBlock()}<div class="story"><b>這一關的變化：</b><br>🍖 生存與生產 ${d.life>=0?'+':''}${d.life}　🛠️ 技術 ${d.tech>=0?'+':''}${d.tech}　👥 社會與文化 ${d.social>=0?'+':''}${d.social}</div>${S.badges.length?`<h3>目前留下的能力與物品</h3><div class="chips">${S.badges.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`:''}<p class="center"><button id="next" class="btn">${i<2?'進入下一階段':'查看最終結果'}</button></p></div>`;next.onclick=()=>i<2?renderRound(i+1):showFinal()}
function showFinal(){play.classList.add('hidden');final.classList.remove('hidden');const s=S.score,m=Math.max(s.life,s.tech,s.social);const top=[['life',s.life],['tech',s.tech],['social',s.social]].filter(x=>x[1]===m);let title=top.length>1?'⚖️ 全能型部落':top[0][0]==='life'?'🌾 豐饒大聚落':top[0][0]==='tech'?'⚒️ 技術開拓者':'🌊 社會文化發展者';const choseJade=S.history.some(h=>h.ids.includes('jade')),choseBurial=S.history.some(h=>h.ids.includes('burial'));final.innerHTML=`<div class="card" id="resultCard"><h2>🏁 第 ${S.group} 組｜${S.tribe}</h2>${scoreBlock()}<h2>${title}</h2><h3>你們的選擇歷程</h3><div class="history">${S.history.map(h=>`<div class="row"><b>第 ${h.stage} 階段｜${h.title}</b><br>選擇：${h.labels.join('、')}<br><span class="delta">數值：🍖 ${h.before.life}→${h.after.life}　🛠️ ${h.before.tech}→${h.after.tech}　👥 ${h.before.social}→${h.after.social}</span></div>`).join('')}</div><h3>玉器與墓葬</h3><div class="story">💎 玉器：${choseJade?'你們有選':'你們沒有選'}　｜　🪦 墓葬：${choseBurial?'你們有選':'你們沒有選'}</div><p class="center"><button id="download" class="btn">⬇️ 下載本組結果圖片</button></p></div><div class="card"><h2>📖 接下來：翻課本整理</h2><p>請完成老師發下的「三個時代、主要特色與代表遺址」表格，再一起討論下面三題。</p><div class="question"><b>3.</b> 有哪些組別選了「玉器」？有哪些組別選了「墓葬」？為什麼史前人願意花很多時間做這些不能直接增加食物的事？</div><div class="question"><b>8.</b> 三組一開始條件相同，最後數值和選擇歷程為什麼不同？請指出一個「早期選擇影響後面」的例子。</div><div class="question"><b>9.</b> 哪一個選擇是你們組現在最想改的？如果重玩，會改成什麼？為什麼？</div></div>`;document.getElementById('download').onclick=downloadImage;window.scrollTo({top:0,behavior:'smooth'})}
function downloadImage(){const canvas=document.createElement('canvas');canvas.width=1400;canvas.height=1350;const c=canvas.getContext('2d');c.fillStyle='#fffdf8';c.fillRect(0,0,canvas.width,canvas.height);c.fillStyle='#2f352f';c.font='bold 52px sans-serif';c.fillText(`史前生存大冒險｜第 ${S.group} 組 ${S.tribe}`,70,90);c.font='bold 34px sans-serif';c.fillText(`最終數值：生存 ${S.score.life}｜技術 ${S.score.tech}｜社會文化 ${S.score.social}`,70,155);let y=225;c.font='bold 32px sans-serif';c.fillText('選擇歷程',70,y);y+=55;c.font='27px sans-serif';S.history.forEach(h=>{c.fillText(`第 ${h.stage} 階段：${h.labels.join('、')}`,70,y);y+=42;c.fillText(`數值：生存 ${h.before.life}→${h.after.life}｜技術 ${h.before.tech}→${h.after.tech}｜社會文化 ${h.before.social}→${h.after.social}`,90,y);y+=60});c.font='bold 30px sans-serif';c.fillText('玉器與墓葬',70,y);y+=48;c.font='27px sans-serif';c.fillText(`玉器：${S.history.some(h=>h.ids.includes('jade'))?'有選':'沒有選'}　墓葬：${S.history.some(h=>h.ids.includes('burial'))?'有選':'沒有選'}`,70,y);const a=document.createElement('a');a.download=`第${S.group}組-${S.tribe}-史前生存結果.png`;a.href=canvas.toDataURL('image/png');a.click()}
document.querySelectorAll('.group').forEach(b=>b.onclick=()=>{S.group=+b.dataset.g;S.tribe=names[S.group];start.classList.add('hidden');play.classList.remove('hidden');renderRound(0)})
})();
</script></body></html>
