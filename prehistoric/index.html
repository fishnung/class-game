<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>史前生存大冒險</title>
<style>
:root{--bg:#f5efe2;--card:#fffdf8;--ink:#2f352f;--muted:#697169;--line:#d8d0bf;--green:#4d7d6d;--gold:#a5764d;--purple:#8067a4;--life:#b85c4a;--tech:#4b6f97;--social:#8067a4}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.w{max-width:960px;margin:auto;padding:16px}.hero{font-size:clamp(30px,5vw,46px);font-weight:900;margin-top:8px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0}.story{background:#fbf4e4;border-left:5px solid var(--gold);padding:15px;border-radius:10px;line-height:1.75}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.group,.opt,.choice{border:2px solid var(--line);border-radius:16px;background:#fff;text-align:left;padding:16px}.group{text-align:center;font-weight:900;font-size:20px}.group small{display:block;font-size:14px;color:var(--muted);margin-top:6px}.opt.sel,.choice.sel{border-color:var(--green);background:#eef6f2}.opt h3{margin:0 0 6px}.opt p{margin:0 0 8px;color:var(--muted);line-height:1.55}.btn{border:0;border-radius:12px;padding:12px 17px;background:var(--green);color:#fff;font-weight:900}.btn.alt{background:#6f5a47}.btn[disabled]{opacity:.45;cursor:not-allowed}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:999px;background:#eee7da;font-weight:700;font-size:14px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.score{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;text-align:center}.score b{display:block;font-size:32px}.life b{color:var(--life)}.tech b{color:var(--tech)}.social b{color:var(--social)}.choice{display:block;width:100%;margin:8px 0}.choice.sel{border-color:var(--purple);background:#f2edf8}.hidden{display:none}.small{font-size:13px;color:var(--muted)}.center{text-align:center}.history{display:grid;gap:10px}.hist{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.hist h3{margin:0 0 8px}.delta{font-weight:800;color:#5d665f}.question{padding:12px 14px;background:#f5f0e6;border-radius:12px;margin:9px 0;line-height:1.6}.mystery{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.blanktable{width:100%;border-collapse:collapse;margin-top:10px}.blanktable th,.blanktable td{border:1px solid var(--line);padding:10px;text-align:left}.blanktable th{background:#f3ecdf}.blanktable td{height:42px}.now{border:1px solid var(--line);background:#f8fbf9;border-radius:16px;padding:12px;margin:12px 0}.now h3{margin:0 0 8px}.note{font-size:14px;color:var(--muted);line-height:1.5}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#ece7dc;font-size:13px;font-weight:800;margin-right:6px}.download{margin-top:14px}.mchoice{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}.mchoice.sel{border-color:var(--green);background:#eef6f2}@media(max-width:680px){.grid,.scores,.groups{grid-template-columns:1fr}}
</style>
</head>
<body><div class="w">
<div class="hero">🏕️ 史前生存大冒險</div><p class="muted">島嶼部落的萬年生存記｜國小五年級體驗版</p>
<section id="start" class="card"><h2>你們就是史前人。</h2><p>每關有 <b>4 點人力</b>，每個行動花 2 點，所以四個行動只能選兩個。以前學會的東西，有些會影響後面的發展。</p><p><b>先選你們的組別：</b></p><div class="groups"><button class="group" data-g="1">第 1 組<small>🌊 海風部落</small></button><button class="group" data-g="2">第 2 組<small>🦌 山鹿部落</small></button><button class="group" data-g="3">第 3 組<small>🔥 岩火部落</small></button></div></section>
<section id="play" class="hidden"></section><section id="final" class="hidden"></section>
</div>
<script>
(()=>{
const S={group:0,tribe:'',score:{life:0,tech:0,social:0},badges:[],culture:null,history:[],mystery:[]};
const names={1:'海風部落',2:'山鹿部落',3:'岩火部落'};
const rounds=[
{icon:'🌊',title:'海邊洞穴的生存挑戰',story:'你們住在臺灣東部靠海的洞穴附近。沒有農田、商店、冰箱。海邊有魚蝦貝類，森林有植物和動物。天氣變冷了，你們要把人力用在哪兩件事？',o:[['stone','🪨 敲製石器','找堅硬石頭互相敲擊，做出有鋒利邊緣的工具。','🛠️+2 🍖+1',{tech:2,life:1},'打製石器'],['fire','🔥 取得火源','找到可以利用的火源，想辦法保存火種，持續用來取暖與烤食物。','🍖+2 🛠️+1',{life:2,tech:1},'用火'],['shore','🐟 海邊找食物','捕魚、撿貝類、採集海邊能取得的食物。','🍖+3',{life:3},null],['hunt','🐗 森林狩獵採集','合作追蹤動物，也採集可食用的植物。','🍖+2 👥+1',{life:2,social:1},null]]},
{icon:'🌾',title:'平原上的新生活',story:'又過了很久。你們發現有些植物可以種在住家附近，也開始照顧動物。人們住得更固定：怎麼讓食物更穩定？怎麼保存？怎麼讓更多人一起生活？',o:[['farm','🌾 農耕與飼養','種植作物，也開始飼養動物。','🍖+3；有打製石器再🛠️+1',{life:3},'農耕生活'],['polish','🪨 磨製石器','把石器磨得更適合生活與農耕。','🛠️+2 🍖+1',{tech:2,life:1},'磨製石器'],['pot','🏺 製作陶器','挖黏土、塑形，再用高溫燒硬，用來裝東西。','🛠️+2 🍖+1；有用火再🛠️+1',{tech:2,life:1},'陶器'],['settle','🏘️ 建立固定聚落','合作蓋房屋、整理生活空間，讓更多人一起居住。','👥+2 🍖+1；有農耕再👥+1',{social:2,life:1},'聚落']]},
{icon:'⚒️',title:'大聚落的新技術',story:'聚落已經更大。石頭工具雖然能用，但大量農事很花力氣。有人學會利用高溫處理金屬材料。你們要投入哪兩件事？',o:[['iron','🔥 研究高溫煉鐵','研究爐火與材料，學習製作鐵器。','🛠️+3',{tech:3},'煉鐵技術'],['tools','⛏️ 製作鐵製工具','做更耐用的工具幫助農耕與日常工作。','🛠️+2 🍖+1；有煉鐵再🍖+2',{tech:2,life:1},'鐵農具'],['morefarm','🌾 擴大農業生產','投入更多人力耕作。','🍖+3；有鐵農具再🍖+1',{life:3},null],['moretown','🏘️ 擴大聚落','整理房屋、物資與合作。','👥+2 🍖+1',{social:2,life:1},null]]}
];
const add=x=>Object.entries(x||{}).forEach(([k,v])=>S.score[k]+=v);
function bonus(id){if(id==='farm'&&S.badges.includes('打製石器'))return{tech:1};if(id==='pot'&&S.badges.includes('用火'))return{tech:1};if(id==='settle'&&S.badges.includes('農耕生活'))return{social:1};if(id==='tools'&&S.badges.includes('煉鐵技術'))return{life:2};if(id==='morefarm'&&S.badges.includes('鐵農具'))return{life:1};return null}
function scoreBox(){return `<div class="now"><h3>目前部落狀態</h3><div class="scores"><div class="score life">🍖 生存與生產<b>${S.score.life}</b></div><div class="score tech">🛠️ 技術<b>${S.score.tech}</b></div><div class="score social">👥 社會與文化<b>${S.score.social}</b></div></div></div>`}
function applyRound(i,chosen){const before={...S.score};const labels=[];chosen.forEach(id=>{const x=rounds[i].o.find(a=>a[0]===id);labels.push(x[1]);add(x[4]);add(bonus(id));if(x[5]&&!S.badges.includes(x[5]))S.badges.push(x[5])});S.history.push({stage:i+1,title:rounds[i].title,choices:labels,before,after:{...S.score}})}
function renderRound(i){const r=rounds[i];let chosen=[];play.innerHTML=`<div class="card"><h2>${r.icon} ${r.title}</h2><p class="muted">第 ${S.group} 組｜${S.tribe}</p>${scoreBox()}<div class="story">${r.story}</div><p><span class="chip">⚡ 4 點人力</span> <span class="chip">四選二</span></p><div class="grid">${r.o.map((x,j)=>`<button class="opt" data-id="${x[0]}"><h3>${String.fromCharCode(65+j)}. ${x[1]}</h3><p>${x[2]}</p><b>${x[3]}</b></button>`).join('')}</div><p class="center">已選 <b id="cnt">0</b>/2</p><p class="center"><button id="ok" class="btn" disabled>確認這一關</button></p></div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(chosen.includes(id)){chosen=chosen.filter(x=>x!==id);b.classList.remove('sel')}else if(chosen.length<2){chosen.push(id);b.classList.add('sel')}cnt.textContent=chosen.length;ok.disabled=chosen.length!==2});ok.onclick=()=>{applyRound(i,chosen);if(i===1)return culture();if(i<2)return bridge(i+1);mystery1()}}
function bridge(n){const h=S.history[S.history.length-1];play.innerHTML=`<div class="card"><h2>📌 這一階段結束</h2>${scoreBox()}<div class="story"><b>你們剛剛選了：</b>${h.choices.join('、')}<br><span class="delta">數值變化：🍖 ${h.before.life}→${h.after.life}　🛠️ ${h.before.tech}→${h.after.tech}　👥 ${h.before.social}→${h.after.social}</span></div><h3>目前留下的技術與生活痕跡</h3><div class="chips">${S.badges.map(x=>`<span class="chip">✓ ${x}</span>`).join('')||'<span class="chip">目前沒有技術物品</span>'}</div><p class="center"><button id="next" class="btn">進入下一階段</button></p></div>`;next.onclick=()=>renderRound(n)}
function culture(){const h=S.history[S.history.length-1];play.innerHTML=`<div class="card"><h2>🌙 聚落文化事件：我們不只想活著</h2>${scoreBox()}<div class="story"><b>你們第二階段剛剛選了：</b>${h.choices.join('、')}<br><span class="delta">數值變化：🍖 ${h.before.life}→${h.after.life}　🛠️ ${h.before.tech}→${h.after.tech}　👥 ${h.before.social}→${h.after.social}</span></div><p>聚落裡，有人花很多時間磨製漂亮的玉器；人們也會為過世的族人安排墓葬。這些事情不能直接增加食物。</p><h3>你們最想提出哪一種推測？</h3>${['覺得漂亮，想裝飾自己','可能表示某種身分或重要性','可能和祖先、死亡、儀式或信仰有關','可能和送禮、交換或人際關係有關','以上都有可能，要看更多證據'].map((x,i)=>`<button class="choice" data-i="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}<p class="center"><button id="go" class="btn" disabled>記下推測，繼續</button></p></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');S.culture={index:+b.dataset.i,text:b.textContent.trim()};go.disabled=false});go.onclick=()=>renderRound(2)}
function mystery1(){const h=S.history[S.history.length-1];let pick='';play.innerHTML=`<div class="card"><h2>🧭 神秘物品事件 1</h2>${scoreBox()}<div class="story"><b>你們第三階段剛剛選了：</b>${h.choices.join('、')}<br><span class="delta">數值變化：🍖 ${h.before.life}→${h.after.life}　🛠️ ${h.before.tech}→${h.after.tech}　👥 ${h.before.social}→${h.after.social}</span></div><div class="mystery"><h3>💚 一件奇怪的事</h3><p>考古學家發現：有一種主要產自臺灣東部的玉，卻出現在臺灣許多不同地方的史前遺址。</p><p><b>問題：</b>如果當時沒有貨車、網購，你覺得最可能發生了什麼事？</p>${['不同聚落之間有人移動或交換物品','每個地方都自己產出完全一樣的玉','玉是自然從東部漂到各地','無法推測，完全沒有任何線索'].map((x,i)=>`<button class="mchoice" data-v="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><p class="center"><button id="m1" class="btn" disabled>記下推測</button></p></div>`;document.querySelectorAll('.mchoice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mchoice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pick=b.textContent.trim();m1.disabled=false});m1.onclick=()=>{S.mystery.push({title:'玉的分布',answer:pick});mystery2()}}
function mystery2(){let pick='';play.innerHTML=`<div class="card"><h2>🧭 神秘物品事件 2</h2>${scoreBox()}<div class="mystery"><h3>🔵 又一件奇怪的事</h3><p>考古學家在臺灣北部的史前遺址發現外來的琉璃珠；另外，也在海外地區發現來自臺灣的玉。</p><p><b>問題：</b>這兩個線索放在一起，你覺得最值得提出哪一個推測？</p>${['史前臺灣可能已經有跨海移動與交換','所有史前人都住在同一個地方','琉璃珠一定是在臺灣製造的','只要有一顆珠子，就能知道每個人的旅行路線'].map((x,i)=>`<button class="mchoice" data-v="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><p class="center"><button id="m2" class="btn" disabled>完成推測</button></p></div>`;document.querySelectorAll('.mchoice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mchoice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pick=b.textContent.trim();m2.disabled=false});m2.onclick=()=>{S.mystery.push({title:'琉璃珠與臺灣玉',answer:pick});showFinal()}}
function historyHTML(){return S.history.map(h=>`<div class="hist"><h3>第 ${h.stage} 階段｜${h.title}</h3><div><b>選擇：</b>${h.choices.join('、')}</div><div class="delta">🍖 ${h.before.life}→${h.after.life}　🛠️ ${h.before.tech}→${h.after.tech}　👥 ${h.before.social}→${h.after.social}</div></div>`).join('')}
function showFinal(){play.classList.add('hidden');final.classList.remove('hidden');const s=S.score,m=Math.max(s.life,s.tech,s.social);const top=[['life',s.life],['tech',s.tech],['social',s.social]].filter(x=>x[1]===m);let title=top.length>1?'⚖️ 全能型部落':top[0][0]==='life'?'🌾 豐饒大聚落':top[0][0]==='tech'?'⚒️ 技術開拓者':'🌊 社會文化交流者';final.innerHTML=`<div class="card" id="resultCard"><h2>🏁 第 ${S.group} 組｜${S.tribe}</h2><div class="scores"><div class="score life">🍖 生存與生產<b>${s.life}</b></div><div class="score tech">🛠️ 技術<b>${s.tech}</b></div><div class="score social">👥 社會與文化<b>${s.social}</b></div></div><h2>${title}</h2><h3>你們的選擇歷程</h3><div class="history">${historyHTML()}</div><h3>文化事件推測</h3><div class="hist">${S.culture?S.culture.text:'未作答'}</div><h3>神秘物品推測</h3>${S.mystery.map(x=>`<div class="hist"><b>${x.title}</b><br>${x.answer}</div>`).join('')}</div><div class="card"><h2>📚 接下來：用課本整理證據</h2><p>請全組翻課本，把剛剛遊戲中遇到的內容整理進表格。先不要只抄名詞，要找出「生活方式、工具技術、考古證據」之間的關係。</p><table class="blanktable"><tr><th>階段／時代</th><th>怎麼取得食物？</th><th>用了哪些工具或技術？</th><th>課本提供哪些文物／遺址證據？</th></tr><tr><td>第一階段</td><td></td><td></td><td></td></tr><tr><td>第二階段</td><td></td><td></td><td></td></tr><tr><td>第三階段</td><td></td><td></td><td></td></tr></table><h2>討論問題</h2><div class="question">1. 第一階段四個選項中，哪些是「直接取得食物」？哪些是「先投資工具或技術」？你們為什麼這樣選？</div><div class="question">2. 第二階段中，農耕、磨製石器、陶器、固定聚落之間可能有什麼關係？課本哪一句或哪一張圖可以支持你們的說法？</div><div class="question">3. 你們有沒有某一關因為前面學過的技術而得到額外加成？這和「技術會累積」有什麼關係？</div><div class="question">4. 玉器與墓葬不能直接增加食物，為什麼人還會花時間製作或安排？哪些是證據，哪些只是我們的推測？</div><div class="question">5. 臺灣不同地方都發現臺灣玉，可以推測出什麼？還需要哪些證據，才能讓推測更有把握？</div><div class="question">6. 外來琉璃珠與海外發現的臺灣玉，放在一起看，可以支持什麼關於史前臺灣的說法？</div><div class="question">7. 三組最後數值不同，是從哪一次選擇開始分岔的？哪一個決定對後面影響最大？</div><p class="download"><button id="download" class="btn alt">⬇️ 下載本組結果圖片</button></p><p class="note">下載的圖片會包含最終數值、三階段選擇與推測紀錄，方便交給老師或之後討論。</p></div>`;download.onclick=downloadResult;window.scrollTo({top:0,behavior:'smooth'})}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){const chars=[...text];let line='';for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=ch;y+=lineHeight}else line=test}if(line){ctx.fillText(line,x,y);y+=lineHeight}return y}
function downloadResult(){const c=document.createElement('canvas');c.width=1400;c.height=1800;const ctx=c.getContext('2d');ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#2f352f';ctx.font='bold 54px sans-serif';ctx.fillText(`史前生存大冒險｜第 ${S.group} 組 ${S.tribe}`,70,90);ctx.font='bold 34px sans-serif';ctx.fillText(`🍖 生存與生產 ${S.score.life}    🛠️ 技術 ${S.score.tech}    👥 社會與文化 ${S.score.social}`,70,160);let y=235;ctx.font='bold 34px sans-serif';ctx.fillText('三階段選擇歷程',70,y);y+=55;for(const h of S.history){ctx.font='bold 28px sans-serif';ctx.fillText(`第 ${h.stage} 階段｜${h.title}`,70,y);y+=42;ctx.font='26px sans-serif';y=wrapText(ctx,`選擇：${h.choices.join('、')}`,90,y,1220,38);y=wrapText(ctx,`數值：🍖 ${h.before.life}→${h.after.life}　🛠️ ${h.before.tech}→${h.after.tech}　👥 ${h.before.social}→${h.after.social}`,90,y,1220,38);y+=24}ctx.font='bold 34px sans-serif';ctx.fillText('文化事件推測',70,y);y+=48;ctx.font='26px sans-serif';y=wrapText(ctx,S.culture?S.culture.text:'未作答',90,y,1220,38);y+=25;ctx.font='bold 34px sans-serif';ctx.fillText('神秘物品推測',70,y);y+=48;for(const m of S.mystery){ctx.font='bold 27px sans-serif';ctx.fillText(m.title,90,y);y+=38;ctx.font='26px sans-serif';y=wrapText(ctx,m.answer,110,y,1180,38);y+=18}ctx.font='22px sans-serif';ctx.fillStyle='#697169';ctx.fillText('請再搭配課本整理表格，找出生活方式、技術與考古證據之間的關係。',70,1740);const a=document.createElement('a');a.download=`第${S.group}組_${S.tribe}_史前生存結果.png`;a.href=c.toDataURL('image/png');a.click()}
document.querySelectorAll('.group').forEach(b=>b.onclick=()=>{S.group=+b.dataset.g;S.tribe=names[S.group];start.classList.add('hidden');play.classList.remove('hidden');renderRound(0)})
